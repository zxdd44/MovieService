name: Java CI/CD with Railway

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile and Package
        run: mvn clean package -DskipTests

  test:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moviesdb
          POSTGRES_USER: postgresql
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgresql -d moviesdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Tests
        run: mvn verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/moviesdb
          SPRING_DATASOURCE_USERNAME: postgresql
          SPRING_DATASOURCE_PASSWORD: password

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy to Railway
        run: railway up --detach --service MovieService
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  verify-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Healthcheck
        run: |
          echo "Waiting for app to start..."
          for i in {1..10}; do
            if curl -s -f https://movieservice-production-dd97.up.railway.app/actuator/health | grep "UP"; then
              echo "App is UP!"
              exit 0
            fi
            echo "Retry $i: App is not ready yet..."
            sleep 10
          done
          echo "App failed to start in time"
          exit 1